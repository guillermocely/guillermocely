name: Actualizar README del perfil

on:
  # Se ejecuta solo cada día a las 6:00 UTC
  schedule:
    - cron: "0 6 * * *"
  # Y también cuando tú lo ejecutes a mano desde la pestaña Actions
  workflow_dispatch:

# Permiso para que el workflow pueda hacer commit en tu repo
permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar la tabla de repositorios y actualizar el README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import os
          import re
          import json
          import urllib.request

          owner = os.environ["OWNER"]
          token = os.environ["GITHUB_TOKEN"]

          # 1. Buscar el archivo del README sin importar mayúsculas/minúsculas
          nombre_readme = None
          for archivo in os.listdir("."):
              if archivo.lower() == "readme.md":
                  nombre_readme = archivo
                  break
          if nombre_readme is None:
              raise SystemExit("No encontré ningún README.md / readme.md en el repositorio")

          # 2. Pedir tus repositorios a la API de GitHub (ordenados por último push)
          url = f"https://api.github.com/users/{owner}/repos?sort=pushed&per_page=100&type=owner"
          peticion = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
              },
          )
          with urllib.request.urlopen(peticion) as respuesta:
              repos = json.load(respuesta)

          # 3. Quitar forks y el propio repo del perfil, y quedarnos con los 6 más recientes
          repos = [
              r for r in repos
              if not r["fork"] and r["name"].lower() != owner.lower()
          ][:6]

          # 4. Construir la tabla en Markdown
          lineas = [
              "| Repositorio | Descripción | Lenguaje | ⭐ | Última actividad |",
              "|---|---|---|---|---|",
          ]
          for r in repos:
              descripcion = (r["description"] or "Sin descripción").replace("|", "\\|")
              lenguaje = r["language"] or "-"
              fecha = r["pushed_at"][:10]
              lineas.append(
                  f"| [{r['name']}]({r['html_url']}) | {descripcion} | {lenguaje} | {r['stargazers_count']} | {fecha} |"
              )
          tabla = "\n".join(lineas)

          # 5. Reemplazar lo que haya entre los marcadores del README
          with open(nombre_readme, encoding="utf-8") as archivo:
              contenido = archivo.read()

          patron = re.compile(r"(<!-- REPOS:START -->).*?(<!-- REPOS:END -->)", re.S)
          if not patron.search(contenido):
              raise SystemExit("No encontré los marcadores REPOS:START / REPOS:END en el README")

          nuevo = patron.sub(lambda m: m.group(1) + "\n" + tabla + "\n" + m.group(2), contenido)

          with open(nombre_readme, "w", encoding="utf-8") as archivo:
              archivo.write(nuevo)
          PY

      - name: Guardar los cambios (commit y push)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Solo hace commit si el README realmente cambió
          if git diff --quiet; then
            echo "No hay cambios, nada que subir."
          else
            git add -A
            git commit -m "chore: actualizar repositorios del README"
            git push
          fi
